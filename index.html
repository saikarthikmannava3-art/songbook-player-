<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Katha's Songbook Player</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: practice-room console — song shelf → song card → sticky transport rail → moving chord lane (the stage) → lyrics → shapes & strums → whole chart.
   Palette: cool steel paper by day, midnight stage by night; one warm accent from a sunburst guitar finish; chord names in cobalt ink. */
:root{
  --bg:#edf0f4; --surface:#ffffff; --sunk:#e1e6ed; --fg:#131a2b; --muted:#5a6477; --line:#d2d9e3;
  --accent:#e0822b; --accent-ink:#1c1205; --accent-soft:#fbe5cf;
  --chord:#2345b5; --now:#ffd46a; --now-ink:#1c1205;
  --good:#1d8a5a; --good-ink:#ffffff; --stage:#182036; --stage-ink:#eef2fa;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#161d2c; --sunk:#111725; --fg:#e8edf6; --muted:#97a2b8; --line:#263045;
  --accent:#f2a24a; --accent-ink:#1a1106; --accent-soft:#3a2a17;
  --chord:#93b2ff; --now:#f4c652; --now-ink:#1a1106;
  --good:#3cc08a; --good-ink:#06180f; --stage:#0a0f1a; --stage-ink:#eef2fa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#161d2c; --sunk:#111725; --fg:#e8edf6; --muted:#97a2b8; --line:#263045;
  --accent:#f2a24a; --accent-ink:#1a1106; --accent-soft:#3a2a17;
  --chord:#93b2ff; --now:#f4c652; --now-ink:#1a1106;
  --good:#3cc08a; --good-ink:#06180f; --stage:#0a0f1a; --stage-ink:#eef2fa; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-block:16px 30vh;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px}
h1{font-family:var(--display);font-weight:900;letter-spacing:.01em;text-transform:uppercase;color:var(--fg);margin:0;font-size:clamp(30px,6vw,44px);line-height:.95}
h1 span{color:var(--accent)}
h2,h3{text-wrap:balance}
body{line-height:1.45}
.sub{color:var(--muted);margin:0;font-size:14px}
.shelf{display:flex;flex-wrap:wrap;gap:8px}
.shelf button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 14px;cursor:pointer}
.shelf button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,a:focus-visible,.cell:focus-visible,input:focus-visible,select:focus-visible,.w:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.songhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.songhead h2{font-family:var(--display);font-weight:800;letter-spacing:.01em;font-size:clamp(24px,5vw,32px);margin:0;color:var(--fg)}
.songhead .by{color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg)}
.pill b{color:var(--accent)}
.pill.qok{background:var(--good);color:var(--good-ink);border-color:var(--good);font-weight:700}.pill.qdraft{border-style:dashed;color:var(--muted)}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.vdesc{font-size:14px;color:var(--muted);margin:6px 0 0}
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:14px;font-weight:700;color:var(--fg);background:var(--bg);border:1px solid var(--line);text-decoration:none;border-radius:8px;padding:7px 11px}
.links a:first-child{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.filerow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.filebtn{font:inherit;font-weight:700;color:var(--fg);border:1px dashed var(--accent);background:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.fname{font-size:13px;color:var(--muted);flex:1 1 220px}
.filerow{position:relative}
/* library + builder */
.lib{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative}
#q{flex:1 1 220px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:9px 12px}
.libbtn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 13px;cursor:pointer}
.libbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.shelf .mine{border-style:dashed}
.shelf .none{color:var(--muted);font-size:14px;padding:6px 2px}
.songtools{display:flex;flex-wrap:wrap;gap:6px}
.songtools button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer}
.bld .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
@media (max-width:560px){.bld .grid label{grid-column:auto!important}}
.bld label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.bld input[type=text],.bld input[type=url],.bld input[type=number],.bld select,.bld textarea{font:16px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.bld textarea{min-height:70px}
.bld .row{display:flex;gap:6px;align-items:center}
.bld .row>*{min-width:0}
.bld .mini{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:700 14px var(--mono);border:1px solid var(--line);background:var(--bg);color:var(--chord);border-radius:6px;padding:6px 9px;cursor:pointer}
.chips button.used{border-color:var(--chord)}
.secs{display:flex;flex-direction:column;gap:8px}
.secrow{display:grid;grid-template-columns:140px 1fr 70px 110px auto;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.secrow.focus{border-color:var(--accent)}
.secrow input,.secrow select{background:var(--surface)!important}
.secrow .x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px}
.bld .help{font-size:13px;color:var(--muted);margin:0}
.bld .help code{font-family:var(--mono);color:var(--chord)}
.bld .err{color:var(--accent);font-weight:700;font-size:14px;margin:0}
.bld .actions{display:flex;flex-wrap:wrap;gap:8px}
.bld details.manual{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
.bld details.manual>summary{cursor:pointer;font-weight:700;color:var(--muted)}
.bld details.manual[open]>summary{margin-bottom:10px}
.bld details.manual>*+*{margin-top:12px}
@media (max-width:640px){.secrow{grid-template-columns:1fr 1fr}.secrow .chordsIn{grid-column:1 / -1;order:-1}}
/* warm-up */
.warm{gap:14px}
.warm>summary{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.warm .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.warm .box{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.warm .box h4{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.warm .big{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;color:var(--fg)}
.warm .big small{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);margin-left:6px}
.warm .chips{display:flex;flex-wrap:wrap;gap:6px}
.warm .chips button{font:700 14px var(--mono);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:6px 10px;cursor:pointer}
.warm .chips button.pair{color:var(--chord)}
.warm .chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.warm ol{margin:0;padding-left:22px;display:grid;gap:8px;line-height:1.45}
.warm ol b{color:var(--fg)}
.warm .go{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.03em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;align-self:flex-start}
/* count-in */
.countin{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--stage) 72%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);cursor:pointer}
.countin b{font-family:var(--display);font-weight:900;font-size:min(42vw,280px);line-height:1;color:var(--now);text-shadow:0 8px 40px color-mix(in srgb,var(--now) 50%,transparent)}
.countin b.pop{animation:pop .9s ease-out both}
.countin small{position:absolute;bottom:calc(32px + env(safe-area-inset-bottom,0px));color:var(--stage-ink);font-size:15px;opacity:.8}
@keyframes pop{0%{transform:scale(1.35);opacity:0}25%{opacity:1}100%{transform:scale(.9);opacity:.85}}
@media (prefers-reduced-motion:reduce){.countin b.pop{animation:none}}
/* transport */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button,.bar select{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 11px;cursor:pointer;min-height:40px}
#play{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:150px;font-size:18px;font-family:var(--display);font-weight:800;letter-spacing:.03em;text-transform:uppercase}
#met[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#lock{border-color:var(--accent);color:var(--accent)}
#tapBtn[aria-pressed="true"],#loopBtn[aria-pressed="true"],#rampBtn[aria-pressed="true"],#mapBtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lstat.good{background:var(--good);color:var(--good-ink)}.lstat.mid{background:var(--now);color:var(--now-ink)}.lstat.bad{background:var(--accent);color:var(--accent-ink)}
.ccard.ok{box-shadow:inset 0 -5px 0 var(--good)}.ccard.meh{box-shadow:inset 0 -5px 0 var(--now)}.ccard.bad{box-shadow:inset 0 -5px 0 var(--accent)}
.mappanel{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px}
.mappanel .big{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important;font-size:17px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:30;max-width:90vw}
#listen[aria-pressed="true"]{background:var(--chord);color:var(--surface);border-color:var(--chord)}
.lstat{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.lstat.ok{background:var(--chord);color:var(--surface)}
.grp{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface)}
.grp button{border:0;min-height:34px;padding:4px 9px;background:transparent}
.grp .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 4px 0 6px}
#bpm{width:58px;font:700 17px var(--mono);text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);padding:5px 2px}
#clock{font-family:var(--mono);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;margin-left:auto}
.beats{display:flex;gap:5px}
.beats i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.beats i.on{background:var(--accent)}
.beats i.on.one{background:var(--now);box-shadow:0 0 0 2px var(--accent)}
.hint{flex-basis:100%;font-size:13px;color:var(--muted);margin:0}
.hint b{color:var(--fg)}
/* stage: chord sheet for the current section */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.stagehd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.secname{font-family:var(--display);font-weight:900;font-size:clamp(26px,5vw,36px);letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--fg)}
.nextup{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 12px;transition:background .2s,color .2s}
.nextup .nl{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.nextup b{color:var(--fg)}.nextup .nc{font-family:var(--mono);font-size:12px}
.nextup.soon{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.nextup.soon b{color:var(--accent-ink)}
.blocks{display:flex;flex-direction:column;gap:14px}
.blk{display:flex;flex-direction:column;gap:8px}
.blk .blklab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.blk.cur .blklab{display:none}
.blk.next{opacity:.5}.blk.next .ccard{transform:none}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ccard{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s;min-width:0}
.ccard .ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.ccard .names{display:flex;align-items:baseline;gap:4px;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--chord)}
.ccard .names .arrow{font-size:20px;color:var(--muted)}
.ccard .dgs{display:flex;gap:2px;flex-shrink:0}
.ccard .st,.ccard .ct{display:grid;text-align:center;font-family:var(--mono);border-top:2px solid var(--line);padding-top:4px}
.ccard .ct{border-top:0;padding-top:0}
.ccard .st i{font-style:normal;font-size:17px;border-radius:4px;line-height:24px}
.ccard .st i.acc{font-weight:700}
.ccard .st i.on{background:var(--fg);color:var(--bg)}
.ccard .ct{font-size:10px;opacity:.6}
.ccard.now{border-color:var(--accent);background:color-mix(in srgb,var(--now) 30%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.ccard.now .names{color:var(--fg)}
.ccard.past{opacity:.45}
@media (max-width:700px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}.ccard .names{font-size:28px}}
/* lyrics */
.lyr .tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lyr .tools button,.lyr .tools label{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer}
.lyr .tools button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lyr textarea{width:100%;min-height:320px;font:15px/1.6 var(--mono);border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:12px;resize:vertical}
.sheet{display:flex;flex-direction:column;gap:2px}
.sheet .h{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:14px 0 2px;padding:3px 8px;border-radius:6px;align-self:flex-start}
.sheet .h.now{background:var(--now);color:var(--now-ink)}
.sheet .ln{display:flex;flex-wrap:wrap;align-items:flex-end;row-gap:4px;min-height:1.6em}
.sheet .sg{display:inline-flex;flex-direction:column;margin-right:.35em}
.sheet .c{font:700 15px var(--mono);color:var(--chord);min-height:1.25em;line-height:1.25em}
.sheet .t{white-space:pre-wrap;font-size:18px;line-height:1.3}
.sheet .w{cursor:pointer;border-radius:4px}
.sheet .w:hover{background:var(--sunk)}
.sheet .c.live{background:var(--now);color:var(--now-ink);border-radius:4px;padding:0 4px;margin-left:-4px}
.sheet .ln.liveLine{background:var(--sunk);border-radius:6px;box-shadow:-6px 0 0 var(--sunk),6px 0 0 var(--sunk)}
.lsync{font-size:13px;font-weight:700;margin:0}.lsync.ok{color:var(--good)}.lsync.warn{color:var(--accent)}
.picker{position:fixed;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.picker button{font:700 14px var(--mono);border:1px solid var(--line);background:var(--bg);color:var(--chord);border-radius:6px;padding:6px 9px;cursor:pointer}
.picker button.rm{color:var(--accent);font-family:var(--body)}
.lhint{font-size:13px;color:var(--muted);margin:0}
/* info */
details.card>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";color:var(--muted)}
details[open].card>summary::after{content:"－"}
.shapes{display:flex;flex-wrap:wrap;gap:10px}
.shape{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px 4px;text-align:center}
.shape span{display:block;font-family:var(--mono);font-weight:700;color:var(--chord)}
.strums{display:grid;gap:8px}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sname{font-size:14px;color:var(--muted);min-width:15em}
.slots{display:grid;gap:3px}
.slots i{font-style:normal;font-family:var(--mono);text-align:center;border-radius:5px;background:var(--bg);border:1px solid var(--line);line-height:28px;font-size:16px;width:30px}
.slots i.acc{font-weight:700}
.slots small{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center}
.notes{margin:0;padding-left:18px;line-height:1.55}
.sources{font-size:13px;color:var(--muted);margin:0}
.sources a{color:var(--accent)}
.maphead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.maplegend{font-size:12px;color:var(--muted)}
.chart section{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.chart .sechd{display:flex;flex-direction:column;gap:4px;min-width:0}
.chart h3{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg);margin:0}
.chart .mini{display:flex;gap:3px;font-family:var(--mono);font-size:14px;color:var(--muted)}
.chart .mini i{font-style:normal;width:13px;text-align:center}.chart .mini i.acc{color:var(--fg);font-weight:700}
.chart .g{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.cell{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;color:var(--chord);cursor:pointer;display:inline-flex;align-items:baseline;gap:6px}
.cell .cn{display:inline-flex;align-items:baseline;gap:3px}.cell .arrow{color:var(--muted);font-weight:600}
.cell .rep{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted)}

  const secs=sections(),bpbN=bpb();const chords=[...new Set(flat.flatMap(b=>b.toks.map(t=>t.c)))];
  // chord-change pairs and how often they happen
  const pairs={};let prev=null;
  secs.forEach(sec=>(sec.bars||[]).forEach(b=>parseBar(b,bpbN).forEach(t=>{if(prev&&t.c!==prev){const k=[prev,t.c].sort().join("↔");pairs[k]=(pairs[k]||0)+1;}prev=t.c;})));
  const top=Object.entries(pairs).sort((a,b)=>b[1]-a[1]).slice(0,4);
  // hardest section = most changes per bar
  let hard=0,hs=-1;secs.forEach((sec,k)=>{let n=0,p=null;(sec.bars||[]).forEach(b=>parseBar(b,bpbN).forEach(t=>{if(p&&t.c!==p)n++;p=t.c;}));const r=n/Math.max(1,(sec.bars||[]).length);if(r>hs){hs=r;hard=k;}});
  const orig=cur.bpm||90,start=Math.max(40,Math.round(orig*0.6/5)*5),steps=[];for(let v=start;v<orig;v+=5)steps.push(v);steps.push(orig);
  const fast=secs.some(sec=>(sec.bars||[]).some(b=>b.trim().split(/\s+/).length>1));
  return {chords,top,hard,orig,start,steps,fast};
}

// chords: "G | Em | C D | D" → bars; without "|", every chord is one bar
function textToBars(t){
  t=String(t||"").trim();if(!t)return [];
  if(t.includes("|"))return t.split("|").map(x=>x.trim().split(/\s+/).filter(Boolean).join(" ")).filter(Boolean);
  return t.split(/\s+/).filter(Boolean);
}
function barsToText(bars){
  const hasSplit=bars.some(b=>/\s/.test(b));
  return hasSplit?bars.map(b=>b.replace(/:\d+(\.\d+)?/g,"")).join(" | "):bars.join(" ");
}

    const t=inp("number",d.times||1);t.min=1;t.max=16;t.title="Repeat";t.setAttribute("aria-label","Repeat times");
    const fe=document.createElement("select");[["ring","Soft (let ring)"],["mid","Medium"],["full","Full"]].forEach(([v,l])=>{const o=el("option",null,l);o.value=v;fe.appendChild(o);});fe.value=d.feel||"full";
    const tools=el("div","row");
    const up=el("button","x","↑");up.type="button";up.title="Move up";up.addEventListener("click",()=>{if(r.previousSibling)secs.insertBefore(r,r.previousSibling);});
    const dup=el("button","x","⧉");dup.type="button";dup.title="Duplicate";dup.addEventListener("click",()=>{const nr=addRow(read(r));secs.insertBefore(nr,r.nextSibling);});
    const rm=el("button","x","✕");rm.type="button";rm.title="Remove";rm.addEventListener("click",()=>{r.remove();});
    tools.append(up,dup,rm);
    const tw=el("div","row");tw.append(el("span",null,"×"),t);tw.firstChild.style.color="var(--muted)";
    r.append(n,ch,tw,fe,tools);r._f={n,ch,t,fe};
    const foc=()=>{if(focusRow)focusRow.classList.remove("focus");focusRow=r;r.classList.add("focus");};
    [n,ch,t,fe].forEach(x=>x.addEventListener("focus",foc));
    secs.appendChild(r);if(!focusRow)foc();return r;
  }
  const read=r=>({name:r._f.n.value,chords:r._f.ch.value,times:+r._f.t.value||1,feel:r._f.fe.value});
  function addChord(k){if(!focusRow||!focusRow.isConnected){const rows=secs.children;if(!rows.length)return;focusRow=rows[rows.length-1];}
    const i=focusRow._f.ch;i.value=(i.value.trim()?i.value.trim()+" ":"")+k;i.focus();}
  f.sections.forEach(addRow);
  const add=el("button","mini","＋ Add section");add.type="button";add.addEventListener("click",()=>{const r=addRow({name:"Section",chords:"",times:1,feel:"full"});r._f.n.focus();r._f.n.select();});
  scw.appendChild(add);man.appendChild(scw);

  const fN=document.createElement("textarea");fN.value=f.notes||"";fN.placeholder="Tips for yourself, one per line";
  man.appendChild(field("Notes (optional)",fN));
  const err=el("p","err","");c.appendChild(err);
  const act=el("div","actions");
  const save=el("button","libbtn primary","✨ Fill everything from the tutorial");save.type="button";
  const relabel=()=>{const has=[...secs.children].some(r=>r._f.ch.value.trim());save.textContent=has?"✓ Save & open play-along":"✨ Fill everything from the tutorial";};
  secs.addEventListener("input",relabel);man.addEventListener("click",()=>setTimeout(relabel,0));relabel();
  const cancel=el("button","libbtn","Cancel");cancel.type="button";cancel.addEventListener("click",()=>{building=false;choose((cur&&songs.find(x=>x.id===cur.id)?cur:songs[0]).id);});
  act.append(save,cancel);c.appendChild(act);
  main.appendChild(c);fT.focus();

  save.addEventListener("click",()=>{
    err.textContent="";
    const title=fT.value.trim();
    const hasChords=[...secs.children].some(r=>r._f.ch.value.trim());
    if(!hasChords){if(!fTut.value.trim()&&!fY.value.trim()&&!title){err.textContent="Paste the tutorial link (or the song name).";fTut.focus();return;}
      askClaude(title,fA.value.trim(),fY.value.trim(),err,fTut.value.trim());return;}
    if(!title){err.textContent="Add a song title.";fT.focus();return;}
    const time=TIMES[fM.value];const rows=[...secs.children].map(read);
    const bad=[];const sections=rows.map(r=>{const one=textToBars(r.chords);let bars=[];for(let i=0;i<r.times;i++)bars=bars.concat(one);
      bars.forEach(b=>b.split(/\s+/).forEach(c=>{if(!/^[A-G][#b]?[^\s|]*$/.test(c))bad.push(c);}));
      return {name:r.name.trim()||"Section",feel:r.feel,bars};}).filter(x=>x.bars.length);
    if(!sections.length){askClaude(title,fA.value.trim(),fY.value.trim(),err);return;}
    if(bad.length){err.textContent="These don't look like chords: "+[...new Set(bad)].join(", ")+". Chords start with A–G (e.g. G, Em, Cadd9, D/F#).";return;}
    const yt=fY.value.trim();if(yt&&!ytId(yt)){err.textContent="That YouTube link doesn't look right — paste the video's address (youtube.com/watch?v=… or youtu.be/…).";fY.focus();return;}
    const pre=Object.fromEntries(PRESETS[fM.value]);
    const strums=strumSel.map((sel,i)=>({label:"Pattern "+(i+1)+" — "+(pre[sel.value]||sel.value),s:sel.value}));
    const ringP=PRESETS[fM.value].find(p=>/let ring/.test(p[1]))[0];
    const simple=sections.map(x=>({name:x.name,feel:x.feel,bars:x.bars.map(b=>{const t=parseBar(b,time.bpb);const m=Math.max(...t.map(y=>y.b));return simplifyChord(t.find(y=>y.b===m).c);})}));
    const id=editId||("c-"+Date.now().toString(36));
    const old=customSongs();const prevOrder=(old.find(x=>x.id===id)||{}).order;
    const song={id,edited:true,order:prevOrder||1000+old.length,title,artist:fA.value.trim(),key:fK.value.trim(),capo:+fC.value,bpm:Math.max(30,Math.min(240,+fB.value||90)),
      beatsPerBar:time.bpb,subdiv:time.sub,timeLabel:time.label,firstBeat:0,youtube:yt,
      links:(yt?[{label:"Play-along video",url:yt}]:[]).concat(fTut.value.trim()?[{label:"Tutorial",url:fTut.value.trim()}]:[]),
      patterns:{ring:{label:"Soft — one strum, let ring",s:ringP},mid:{label:strums[0].label,s:strums[0].s},full:{label:strums[1].label,s:strums[1].s}},
      strums,
      versions:{simple:{label:"Easy",desc:"Auto-made from your chords: open chords only (barre chords swapped for open versions like Fmaj7, Bm7, B7), one chord per bar, no mid-bar changes.",sections:simple},
                intermediate:{label:"Intermediate",desc:"Exactly the chords you entered.",sections},
                band:{label:"Band",desc:"Your chords — edit the song to add colour chords (Cadd9, Dsus4, D/F#…).",sections}},
      notes:fN.value.split("\n").map(x=>x.trim()).filter(Boolean)};
    const list=old.filter(x=>x.id!==id);list.push(song);saveCustom(list);
    store.set("sb-tune-"+id,null);refreshSongs();choose(id);
  });
}

// ---------- 👂 Auto-sync: listen to the YouTube tab (live, nothing recorded) ----------
let listening=false;
const LS={stream:null,ctx:null,node:null,env:[],lastLow:0,lastAll:0,lp:0,silentMs:0,auto:false,lastFix:0,lastTempo:0,status:"",conf:0};
async function startListening(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){alert("This browser can't share tab audio. Use Chrome on a computer.");return;}
  let st;
  try{st=await navigator.mediaDevices.getDisplayMedia({video:true,audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,suppressLocalAudioPlayback:false},selfBrowserSurface:"exclude",preferCurrentTab:false,systemAudio:"include"});}
  catch(e){return;}
  const at=st.getAudioTracks();
  if(!at.length){st.getTracks().forEach(t=>t.stop());alert("No sound was shared. Try again: pick the YouTube tab under “Chrome Tab” and switch on “Also share tab audio”.");return;}
  st.getVideoTracks().forEach(t=>t.stop());
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const src=ac.createMediaStreamSource(new MediaStream(at));
  const node=ac.createScriptProcessor(1024,1,1),mute=ac.createGain();mute.gain.value=0;
  src.connect(node);node.connect(mute);mute.connect(ac.destination);
  const an=ac.createAnalyser();an.fftSize=8192;an.smoothingTimeConstant=0.6;src.connect(an);
  node.onaudioprocess=onAudio;
  at[0].addEventListener("ended",stopListening);
  Object.assign(LS,{an,stream:st,ctx:ac,node,env:[],silentMs:0,auto:false,status:"waiting for sound",conf:0});
  listening=true;if(mode!=="tab"){mode="tab";const ms=$("mode");if(ms)ms.value="tab";}
  // already playing? let the listener take over pausing/resuming; not started? it starts when the song makes sound
  if(!pOn)LS.auto=true;
  audio();ui();
}
function stopListening(){
  listening=false;try{LS.node&&(LS.node.onaudioprocess=null);LS.stream&&LS.stream.getTracks().forEach(t=>t.stop());LS.ctx&&LS.ctx.close();}catch(e){}
  Object.assign(LS,{an:null,stream:null,ctx:null,node:null,env:[],auto:false,status:""});ui();
}
function onAudio(e){
  if(!cur||mode!=="tab")return;
  const x=e.inputBuffer.getChannelData(0),n=x.length,sr=e.inputBuffer.sampleRate,durMs=n/sr*1000;
  const now=performance.now(),stamp=now-durMs/2;
  // energy: full band and low band (one-pole low-pass ≈150 Hz for kick/bass)
  let all=0,low=0,lp=LS.lp;const a=Math.exp(-2*Math.PI*150/sr);
  for(let i=0;i<n;i++){const v=x[i];all+=v*v;lp=a*lp+(1-a)*v;low+=lp*lp;}LS.lp=lp;
  const rms=Math.sqrt(all/n);
  const lA=Math.log(1e-9+all/n),lL=Math.log(1e-9+low/n);
  const on=Math.max(0,lA-LS.lastAll)+1.5*Math.max(0,lL-LS.lastLow);LS.lastAll=lA;LS.lastLow=lL;
  // pause / resume with the video
  if(rms<4e-4){LS.silentMs+=durMs;}else{
    if(LS.auto&&!pOn){LS.auto=false;pStart=stamp;pOn=true;LS.env=[];schedReset();kick();LS.status="following";ui();}
    LS.silentMs=0;}
  if(LS.silentMs>1200&&pOn){const back=LS.silentMs/1000*speed;pOff=Math.max(0,songT()-back);pOn=false;LS.auto=true;LS.env=[];LS.status="paused with video";schedReset();ui();paint(true);return;}
  if(!pOn)return;
  LS.env.push({w:stamp,v:rms<4e-4?0:on});
  while(LS.env.length&&now-LS.env[0].w>9000)LS.env.shift();
  if(now-LS.lastFix>400&&now-LS.env[0].w>4000){LS.lastFix=now;track(now);}
}
// beat tracking: autocorrelation for tempo (±7% of current BPM), comb filter for phase → gentle PLL on the chord clock
function track(now){
  const E=LS.env;if(E.length<60)return;
  const P=beatLen()*1000/speed;                     // beat period in wall ms
  const vals=E.map(o=>o.v),m=vals.reduce((a,b)=>a+b,0)/vals.length;
  // tempo (every ~2 s)
  if(now-LS.lastTempo>2000){LS.lastTempo=now;
    const dt=(E[E.length-1].w-E[0].w)/(E.length-1),c=vals.map(v=>v-m);
    let best=0,bl=0,sum=0,cnt=0;
    for(let lag=Math.floor(P*0.93/dt);lag<=Math.ceil(P*1.07/dt);lag++){let r=0;for(let i=0;i+lag<c.length;i++)r+=c[i]*c[i+lag];r/=c.length-lag;sum+=r;cnt++;if(r>best){best=r;bl=lag;}}
    // refine with parabolic interpolation
    if(bl&&cnt&&best>1.4*Math.max(1e-9,sum/cnt)){
      const R=lag=>{let r=0;for(let i=0;i+lag<c.length;i++)r+=c[i]*c[i+lag];return r/(c.length-lag);};
      const y0=R(bl-1),y1=best,y2=R(bl+1),d=(y0-2*y1+y2)?0.5*(y0-y2)/(y0-2*y1+y2):0;
      const Pest=(bl+Math.max(-0.5,Math.min(0.5,d)))*dt,bpmEst=60000/(Pest*speed);
      if(Math.abs(bpmEst-tune.bpm)/tune.bpm<0.07){const p=posAt(songT());tune.bpm=Math.round((tune.bpm+0.25*(bpmEst-tune.bpm))*10)/10;pOff=timeAtPos(p);pStart=performance.now();saveTune();}
    }}
  // phase
  const P2=beatLen()*1000/speed,K=40,score=new Array(K).fill(0),sig=P2*0.07;
  E.forEach(o=>{if(!o.v)return;const ph=((o.w%P2)+P2)%P2;for(let k=0;k<K;k++){let d=Math.abs(ph-k*P2/K);d=Math.min(d,P2-d);score[k]+=o.v*Math.exp(-d*d/(2*sig*sig));}});
  let bk=0;for(let k=1;k<K;k++)if(score[k]>score[bk])bk=k;
  const mean=score.reduce((a,b)=>a+b,0)/K;LS.conf=mean?score[bk]/mean:0;
  if(LS.conf<1.25){LS.status="listening…";ui();return;}
  const target=bk*P2/K;
  const wall0=pStart+(originOf(secAtTime(songT()))-pOff)*1000/speed;            // wall time of a predicted beat
  const pred=((wall0%P2)+P2)%P2;
  let err=target-pred;err=((err%P2)+P2*1.5)%P2-P2/2;     // wrap to ±P/2
  pOff-=err/1000*speed*0.35;                             // beats arrive later → hold the chords back
  LS.status=Math.abs(err)<P2*0.08?"locked":"syncing";
  ui();
}

document.addEventListener("keydown",e=>{
  if(!cur||building||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.code==="Space"&&!/BUTTON|A/.test(e.target.tagName)&&!e.target.classList.contains("w")){e.preventDefault();isPlaying()?pause():play();}
  if(e.key==="m"||e.key==="M"){metOn=!metOn;store.set("sb-met",metOn);audio();schedReset();ui();}
  if(e.key==="b"||e.key==="B"){if(mode!=="practice")lockBeat();}
  if((e.key==="n"||e.key==="N")&&mapping){e.preventDefault();markSection();}
  if((e.key==="t"||e.key==="T")&&tapMode){e.preventDefault();tapChange();}
  if(e.key==="Escape")closePicker();
});
